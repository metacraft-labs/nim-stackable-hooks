name: CI

on:
  push:
    branches: [main, dev, stable, io-mon-fixes]
  pull_request:
    branches: [main, dev, stable]

env:
  MANIFESTS_REF: io-mon-fixes

jobs:
  lint:
    name: Lint
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dev Environment
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}

      - name: Run lint
        # `shell: bash` is load-bearing, not style. The default `run` shell is
        # `bash -e` WITHOUT pipefail, so `cmd | tee` takes tee's exit status and a
        # failing command was reported as a passing job. `shell: bash` selects
        # `bash --noprofile --norc -eo pipefail`.
        shell: bash
        run: dev-exec just lint 2>&1 | tee lint.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-logs
          path: lint.log
          retention-days: 30

  build:
    name: Build
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        # `slug` names the artifact (a plain string); `runs-on` carries the
        # capability-label array (RC4: the eph-* names are retired).
        include:
          - slug: linux-x64
            runs-on: [self-hosted, linux, x64]
          - slug: macos-arm64
            runs-on: [self-hosted, macos, arm64]
    steps:
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dev Environment
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}

      - name: Run build
        # See the note on the first tee'd step: without pipefail, `| tee` masks failure.
        shell: bash
        run: dev-exec just build 2>&1 | tee build.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.slug }}
          path: build.log
          retention-days: 30

  test:
    name: Test
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: nix
            slug: linux-x64
            runs-on: [self-hosted, linux, x64]
          - env: nix
            slug: macos-arm64
            runs-on: [self-hosted, macos, arm64]
          - env: reprobuild
            slug: linux-x64
            runs-on: [self-hosted, linux, x64]
    steps:
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dev Environment
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: ${{ matrix.env }}
          gh-token: ${{ steps.app-token.outputs.token }}

      - name: Run tests
        # See the note on the first tee'd step: without pipefail, `| tee` masks failure.
        shell: bash
        run: |
          if [ "${{ matrix.env }}" = "reprobuild" ]; then
            repro test 2>&1 | tee test.log
          else
            dev-exec just test 2>&1 | tee test.log
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.slug }}-${{ matrix.env }}
          path: test.log
          retention-days: 30
